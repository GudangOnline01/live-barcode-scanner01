<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Live Barcode Scanner</title>


  <!-- ZXING FALLBACK -->

  <script
    src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    body {
      overflow-x: hidden;
    }


    button,
    input {
      font-family: inherit;
    }


    /* ======================================================
       HEADER
       ====================================================== */

    .header {

      height: 64px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        0 16px;

      background:
        rgba(0,0,0,.95);

      border-bottom:
        1px solid #222;

      position:
        relative;

      z-index: 20;

    }


    .title {

      font-size:
        18px;

      font-weight:
        800;

    }


    .subtitle {

      color:
        #777;

      font-size:
        11px;

      margin-top:
        2px;

    }


    .camera-status {

      display:
        flex;

      align-items:
        center;

      gap:
        7px;

      font-size:
        11px;

      color:
        #888;

    }


    .camera-dot {

      width:
        9px;

      height:
        9px;

      border-radius:
        50%;

      background:
        #555;

    }


    .camera-dot.on {

      background:
        #22c55e;

      box-shadow:
        0 0 10px
        rgba(34,197,94,.8);

    }


    /* ======================================================
       CAMERA
       ====================================================== */

    .camera {

      position:
        relative;

      width:
        100%;

      background:
        #000;

      overflow:
        hidden;

    }


    video {

      display:
        block;

      width:
        100%;

      height:
        auto;

      min-height:
        430px;

      max-height:
        76vh;

      object-fit:
        cover;

      background:
        #000;

    }


    /*
     * Overlay ala Google Lens
     */

    .overlay {

      position:
        absolute;

      inset:
        0;

      pointer-events:
        none;

    }


    .scan-area {

      position:
        absolute;

      left:
        7%;

      right:
        7%;

      top:
        28%;

      height:
        44%;

      border:
        1px solid
        rgba(255,255,255,.35);

      border-radius:
        22px;

      box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.22);

    }


    .corner {

      position:
        absolute;

      width:
        42px;

      height:
        42px;

      border:
        4px solid
        #fff;

    }


    .tl {

      left:
        -2px;

      top:
        -2px;

      border-right:
        0;

      border-bottom:
        0;

      border-radius:
        20px 0 0 0;

    }


    .tr {

      right:
        -2px;

      top:
        -2px;

      border-left:
        0;

      border-bottom:
        0;

      border-radius:
        0 20px 0 0;

    }


    .bl {

      left:
        -2px;

      bottom:
        -2px;

      border-right:
        0;

      border-top:
        0;

      border-radius:
        0 0 0 20px;

    }


    .br {

      right:
        -2px;

      bottom:
        -2px;

      border-left:
        0;

      border-top:
        0;

      border-radius:
        0 0 20px 0;

    }


    .laser {

      position:
        absolute;

      left:
        12px;

      right:
        12px;

      top:
        50%;

      height:
        2px;

      background:
        rgba(255,255,255,.95);

      box-shadow:
        0 0 12px
        rgba(255,255,255,.9);

      animation:
        laser 1.7s
        linear
        infinite;

    }


    @keyframes laser {

      0% {

        transform:
          translateY(-110px);

        opacity:
          .25;

      }

      50% {

        opacity:
          1;

      }

      100% {

        transform:
          translateY(110px);

        opacity:
          .25;

      }

    }


    .instruction {

      position:
        absolute;

      left:
        50%;

      bottom:
        22px;

      transform:
        translateX(-50%);

      padding:
        9px 15px;

      border-radius:
        999px;

      background:
        rgba(0,0,0,.7);

      border:
        1px solid
        rgba(255,255,255,.18);

      white-space:
        nowrap;

      font-size:
        12px;

      color:
        #ddd;

    }


    /* ======================================================
       RESULT
       ====================================================== */

    .result {

      padding:
        16px;

      background:
        #080808;

    }


    .result-card {

      background:
        #111;

      border:
        1px solid
        #292929;

      border-radius:
        18px;

      padding:
        18px;

    }


    .result-label {

      color:
        #666;

      font-size:
        10px;

      margin-bottom:
        8px;

      letter-spacing:
        .5px;

    }


    .sku {

      font-size:
        28px;

      font-weight:
        900;

      letter-spacing:
        .5px;

      word-break:
        break-all;

    }


    .save-status {

      margin-top:
        8px;

      color:
        #777;

      font-size:
        12px;

    }


    .success {

      color:
        #4ade80;

    }


    .error {

      color:
        #f87171;

    }


    /* ======================================================
       CONTROL
       ====================================================== */

    .content {

      padding:
        0 16px 40px;

      background:
        #080808;

    }


    .button {

      width:
        100%;

      border:
        0;

      border-radius:
        15px;

      padding:
        16px;

      font-size:
        15px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    .start {

      background:
        #fff;

      color:
        #000;

    }


    .stop {

      background:
        #dc2626;

      color:
        #fff;

    }


    .operator-box {

      margin-top:
        14px;

    }


    .label {

      display:
        block;

      font-size:
        11px;

      color:
        #666;

      margin-bottom:
        7px;

    }


    input {

      width:
        100%;

      padding:
        14px;

      border-radius:
        12px;

      border:
        1px solid
        #292929;

      background:
        #111;

      color:
        #fff;

      outline:
        none;

      font-size:
        14px;

    }


    input:focus {

      border-color:
        #777;

    }


    /* ======================================================
       STAT
       ====================================================== */

    .stats {

      display:
        grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:
        8px;

      margin-top:
        14px;

    }


    .stat {

      padding:
        13px;

      border-radius:
        13px;

      background:
        #111;

      border:
        1px solid
        #222;

    }


    .stat-label {

      font-size:
        9px;

      color:
        #666;

    }


    .stat-value {

      margin-top:
        5px;

      font-size:
        19px;

      font-weight:
        800;

    }


    /* ======================================================
       MANUAL
       ====================================================== */

    .section {

      margin-top:
        20px;

    }


    .section-title {

      font-size:
        14px;

      font-weight:
        800;

      margin-bottom:
        10px;

    }


    .manual-row {

      display:
        flex;

      gap:
        8px;

    }


    .manual-row input {

      flex:
        1;

      min-width:
        0;

    }


    .manual-button {

      width:
        90px;

      border:
        0;

      border-radius:
        12px;

      background:
        #fff;

      color:
        #000;

      font-weight:
        800;

    }


    /* ======================================================
       HISTORY
       ====================================================== */

    .list {

      background:
        #111;

      border:
        1px solid
        #222;

      border-radius:
        15px;

      overflow:
        hidden;

    }


    .row {

      padding:
        13px;

      border-bottom:
        1px solid
        #222;

    }


    .row:last-child {

      border-bottom:
        0;

    }


    .row-top {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        10px;

    }


    .row-sku {

      font-size:
        13px;

      font-weight:
        700;

      word-break:
        break-all;

    }


    .row-qty {

      font-weight:
        800;

      white-space:
        nowrap;

    }


    .row-info {

      margin-top:
        5px;

      font-size:
        10px;

      color:
        #666;

    }


    .delete {

      margin-top:
        8px;

      padding:
        6px 9px;

      border:
        0;

      border-radius:
        8px;

      background:
        #2a1010;

      color:
        #f87171;

      font-size:
        10px;

    }


    .empty {

      padding:
        25px;

      text-align:
        center;

      color:
        #555;

      font-size:
        12px;

    }


    /* ======================================================
       LOADING
       ====================================================== */

    .loading {

      display:
        inline-block;

      width:
        14px;

      height:
        14px;

      border:
        2px solid
        #555;

      border-top-color:
        #fff;

      border-radius:
        50%;

      animation:
        spin .7s
        linear
        infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* ======================================================
       FLASH
       ====================================================== */

    .flash {

      animation:
        flash .35s
        ease-out;

    }


    @keyframes flash {

      0% {

        box-shadow:
          inset
          0 0 0 5px
          rgba(34,197,94,0);

      }

      50% {

        box-shadow:
          inset
          0 0 0 5px
          rgba(34,197,94,.9);

      }

      100% {

        box-shadow:
          inset
          0 0 0 5px
          rgba(34,197,94,0);

      }

    }


    /* ======================================================
       CANVAS
       ====================================================== */

    canvas {

      display:
        none;

    }

  </style>

</head>


<body>


<!-- ========================================================
     HEADER
     ======================================================== -->

<header class="header">

  <div>

    <div class="title">
      LIVE SCANNER
    </div>

    <div class="subtitle">
      Google Lens Style
    </div>

  </div>


  <div class="camera-status">

    <span
      id="cameraDot"
      class="camera-dot">
    </span>

    <span id="cameraText">
      Kamera OFF
    </span>

  </div>

</header>


<!-- ========================================================
     CAMERA
     ======================================================== -->

<section
  id="camera"
  class="camera"
>

  <video
    id="video"
    autoplay
    muted
    playsinline
  ></video>


  <canvas
    id="canvas">
  </canvas>


  <div class="overlay">

    <div class="scan-area">

      <div class="corner tl"></div>

      <div class="corner tr"></div>

      <div class="corner bl"></div>

      <div class="corner br"></div>

      <div class="laser"></div>

    </div>


    <div
      id="instruction"
      class="instruction"
    >
      Tekan MULAI SCANNER
    </div>

  </div>

</section>


<!-- ========================================================
     RESULT
     ======================================================== -->

<section class="result">

  <div
    id="resultCard"
    class="result-card"
  >

    <div class="result-label">
      BARCODE TERAKHIR
    </div>


    <div
      id="lastSku"
      class="sku"
    >
      —
    </div>


    <div
      id="saveStatus"
      class="save-status"
    >
      Belum ada scan
    </div>

  </div>

</section>


<!-- ========================================================
     CONTENT
     ======================================================== -->

<main class="content">


  <!-- START -->

  <button
    id="startButton"
    class="button start"
    onclick="toggleScanner()"
  >

    📷 MULAI SCANNER

  </button>


  <!-- OPERATOR -->

  <div class="operator-box">

    <label class="label">
      OPERATOR
    </label>

    <input
      id="operator"
      type="text"
      placeholder="Nama operator"
      autocomplete="off"
    >

  </div>


  <!-- STAT -->

  <div class="stats">

    <div class="stat">

      <div class="stat-label">
        TOTAL SCAN
      </div>

      <div
        id="totalScan"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        UNIQUE SKU
      </div>

      <div
        id="uniqueSku"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        TOTAL QTY
      </div>

      <div
        id="totalQty"
        class="stat-value"
      >
        0
      </div>

    </div>

  </div>


  <!-- MANUAL -->

  <div class="section">

    <div class="section-title">
      INPUT MANUAL
    </div>


    <div class="manual-row">

      <input
        id="manualSku"
        type="text"
        placeholder="1042310302302-M"
        autocomplete="off"
        onkeydown="manualEnter(event)"
      >


      <button
        class="manual-button"
        onclick="manualScan()"
      >
        SCAN
      </button>

    </div>

  </div>


  <!-- HISTORY -->

  <div class="section">

    <div class="section-title">
      RIWAYAT SCAN
    </div>


    <div
      id="history"
      class="list"
    >

      <div class="empty">
        Memuat data...
      </div>

    </div>

  </div>


  <!-- SKU SUMMARY -->

  <div class="section">

    <div class="section-title">
      REKAP SKU
    </div>


    <div
      id="skuSummary"
      class="list"
    >

      <div class="empty">
        Memuat data...
      </div>

    </div>

  </div>


</main>


<script>

/* ==========================================================
   KONFIGURASI
   ========================================================== */

/*
 * PENTING:
 *
 * GANTI URL DI BAWAH INI dengan URL Web App Apps Script
 * milik kamu.
 *
 * Contoh:
 *
 * https://script.google.com/macros/s/AKfycbxxxxxxxx/exec
 *
 */

const API_URL =
  'PASTE_URL_APPS_SCRIPT_DI_SINI';


/* ==========================================================
   GLOBAL
   ========================================================== */

let stream = null;

let scannerRunning = false;

let scanTimer = null;

let barcodeDetector = null;

let zxingReader = null;

let zxingHints = null;

let detecting = false;


/*
 * Barcode yang baru terbaca.
 *
 * Ini mencegah satu barcode yang diam di depan kamera
 * terbaca ratusan kali.
 */
const recentScans =
  new Map();


const SAME_BARCODE_COOLDOWN =
  1200;


/*
 * Statistik lokal.
 */
let totalScan = 0;

let totalQty = 0;

const uniqueSku =
  new Set();


let historyData = [];


/* ==========================================================
   ELEMENT
   ========================================================== */

const video =
  document.getElementById(
    'video'
  );


const canvas =
  document.getElementById(
    'canvas'
  );


const ctx =
  canvas.getContext(
    '2d',
    {
      willReadFrequently: true
    }
  );


const cameraBox =
  document.getElementById(
    'camera'
  );


const startButton =
  document.getElementById(
    'startButton'
  );


const cameraDot =
  document.getElementById(
    'cameraDot'
  );


const cameraText =
  document.getElementById(
    'cameraText'
  );


const instruction =
  document.getElementById(
    'instruction'
  );


const lastSku =
  document.getElementById(
    'lastSku'
  );


const saveStatus =
  document.getElementById(
    'saveStatus'
  );


const resultCard =
  document.getElementById(
    'resultCard'
  );


const operatorInput =
  document.getElementById(
    'operator'
  );


/* ==========================================================
   OPERATOR
   ========================================================== */

operatorInput.value =
  localStorage.getItem(
    'scanner_operator'
  ) || '';


operatorInput.addEventListener(
  'input',
  function() {

    localStorage.setItem(
      'scanner_operator',
      this.value
    );

  }
);


/* ==========================================================
   STARTUP
   ========================================================== */

window.addEventListener(
  'load',
  async function() {

    /*
     * Jangan minta kamera otomatis.
     *
     * Browser HP lebih aman meminta permission
     * setelah user menekan tombol.
     */

    await prepareDecoder();

    loadData();

  }
);


/* ==========================================================
   PREPARE DECODER
   ========================================================== */

async function prepareDecoder() {

  /*
   * Native BarcodeDetector
   */

  if (
    'BarcodeDetector' in window
  ) {

    try {

      let formats = [];


      if (
        typeof BarcodeDetector
          .getSupportedFormats ===
        'function'
      ) {

        formats =
          await BarcodeDetector
            .getSupportedFormats();

      }


      const wanted = [

        'code_128',

        'code_39',

        'code_93',

        'codabar',

        'ean_13',

        'ean_8',

        'itf',

        'upc_a',

        'upc_e',

        'qr_code'

      ];


      const usable =
        wanted.filter(
          function(format) {

            return (
              formats.length === 0 ||
              formats.includes(format)
            );

          }
        );


      if (usable.length) {

        barcodeDetector =
          new BarcodeDetector({
            formats: usable
          });

      } else {

        barcodeDetector =
          new BarcodeDetector();

      }


      console.log(
        'Native BarcodeDetector aktif'
      );


    } catch (error) {

      console.log(
        'BarcodeDetector gagal:',
        error
      );

      barcodeDetector =
        null;

    }

  }


  /*
   * ZXing selalu kita siapkan sebagai fallback.
   */

  setupZXing();

}


/* ==========================================================
   ZXING
   ========================================================== */

function setupZXing() {

  if (
    typeof ZXing ===
    'undefined'
  ) {

    console.log(
      'ZXing belum tersedia.'
    );

    return;

  }


  try {

    zxingHints =
      new Map();


    zxingHints.set(

      ZXing.DecodeHintType.POSSIBLE_FORMATS,

      [

        ZXing.BarcodeFormat.CODE_128,

        ZXing.BarcodeFormat.CODE_39,

        ZXing.BarcodeFormat.CODE_93,

        ZXing.BarcodeFormat.CODABAR,

        ZXing.BarcodeFormat.EAN_13,

        ZXing.BarcodeFormat.EAN_8,

        ZXing.BarcodeFormat.ITF,

        ZXing.BarcodeFormat.UPC_A,

        ZXing.BarcodeFormat.UPC_E,

        ZXing.BarcodeFormat.QR_CODE

      ]

    );


    zxingHints.set(

      ZXing.DecodeHintType.TRY_HARDER,

      true

    );


    zxingReader =
      new ZXing.MultiFormatReader();


    zxingReader.setHints(
      zxingHints
    );


  } catch (error) {

    console.log(
      'ZXing setup error:',
      error
    );

    zxingReader =
      null;

  }

}


/* ==========================================================
   START / STOP
   ========================================================== */

async function toggleScanner() {

  if (scannerRunning) {

    stopScanner();

  } else {

    await startScanner();

  }

}


/* ==========================================================
   START CAMERA
   ========================================================== */

async function startScanner() {

  if (
    API_URL ===
    'PASTE_URL_APPS_SCRIPT_DI_SINI'
  ) {

    showStatus(
      'Masukkan URL Apps Script terlebih dahulu.',
      true
    );

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(
      'Browser tidak mendukung kamera.',
      true
    );

    return;

  }


  try {

    instruction.textContent =
      'Membuka kamera...';


    /*
     * Kamera belakang.
     */
    stream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: false,

          video: {

            facingMode: {
              ideal: 'environment'
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30,
              max: 30
            }

          }

        });


    video.srcObject =
      stream;


    await video.play();


    /*
     * Coba continuous autofocus.
     */

    try {

      const track =
        stream
          .getVideoTracks()[0];


      if (
        track &&
        track.getCapabilities
      ) {

        const capabilities =
          track.getCapabilities();


        if (
          capabilities.focusMode &&
          capabilities.focusMode
            .includes('continuous')
        ) {

          await track.applyConstraints({

            advanced: [
              {
                focusMode:
                  'continuous'
              }
            ]

          });

        }

      }

    } catch (focusError) {

      console.log(
        'Autofocus tidak tersedia:',
        focusError
      );

    }


    scannerRunning =
      true;


    cameraDot.classList.add(
      'on'
    );


    cameraText.textContent =
      'Kamera ON';


    startButton.textContent =
      '■ STOP SCANNER';


    startButton.classList.remove(
      'start'
    );


    startButton.classList.add(
      'stop'
    );


    instruction.textContent =
      'Arahkan barcode ke kotak';


    /*
     * Mulai loop.
     */
    startDetectionLoop();


  } catch (error) {

    console.error(
      error
    );


    scannerRunning =
      false;


    let message =
      error.name +
      ' - ' +
      error.message;


    if (
      error.name ===
      'NotAllowedError'
    ) {

      message =
        'Kamera ditolak browser. Pastikan halaman dibuka dari HTTPS dan izin Camera = Allow.';

    }


    if (
      error.name ===
      'NotFoundError'
    ) {

      message =
        'Kamera tidak ditemukan.';

    }


    if (
      error.name ===
      'NotReadableError'
    ) {

      message =
        'Kamera sedang dipakai aplikasi lain.';

    }


    showStatus(
      message,
      true
    );

  }

}


/* ==========================================================
   STOP
   ========================================================== */

function stopScanner() {

  scannerRunning =
    false;


  detecting =
    false;


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );

    scanTimer =
      null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  cameraDot.classList.remove(
    'on'
  );


  cameraText.textContent =
    'Kamera OFF';


  startButton.textContent =
    '📷 MULAI SCANNER';


  startButton.classList.remove(
    'stop'
  );


  startButton.classList.add(
    'start'
  );


  instruction.textContent =
    'Tekan MULAI SCANNER';

}


/* ==========================================================
   DETECTION LOOP
   ========================================================== */

function startDetectionLoop() {

  if (!scannerRunning) {
    return;
  }


  /*
   * Jalankan scan.
   */
  detectFrame();


  /*
   * Jangan gunakan requestAnimationFrame
   * terlalu agresif karena decoder berat.
   *
   * 100ms = sekitar 10 frame scan/detik.
   */
  scanTimer =
    setTimeout(
      startDetectionLoop,
      100
    );

}


/* ==========================================================
   DETECT FRAME
   ========================================================== */

async function detectFrame() {

  if (!scannerRunning) {
    return;
  }


  if (detecting) {
    return;
  }


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return;

  }


  detecting =
    true;


  try {

    /*
     * Kita tidak perlu memproses seluruh resolusi kamera.
     *
     * Lebih cepat.
     */
    const width =
      1280;


    const ratio =
      video.videoHeight /
      video.videoWidth;


    const height =
      Math.round(
        width * ratio
      );


    canvas.width =
      width;


    canvas.height =
      height;


    ctx.drawImage(

      video,

      0,

      0,

      width,

      height

    );


    let found =
      false;


    /* ======================================================
       NATIVE
       ====================================================== */

    if (barcodeDetector) {

      try {

        const results =
          await barcodeDetector
            .detect(canvas);


        if (
          results &&
          results.length
        ) {

          for (
            const result of results
          ) {

            if (
              result.rawValue
            ) {

              const accepted =
                handleBarcode(
                  result.rawValue
                );


              if (accepted) {

                found =
                  true;

                break;

              }

            }

          }

        }

      } catch (error) {

        console.log(
          'Native detector:',
          error
        );

      }

    }


    /* ======================================================
       ZXING FALLBACK
       ====================================================== */

    if (
      !found &&
      zxingReader
    ) {

      try {

        const result =
          zxingReader.decode(
            canvas
          );


        if (result) {

          handleBarcode(
            result.getText()
          );

        }

      } catch (error) {

        /*
         * Barcode tidak ditemukan
         * adalah kondisi normal.
         */

      }

    }

  } catch (error) {

    console.log(
      'Frame error:',
      error
    );

  } finally {

    detecting =
      false;

  }

}


/* ==========================================================
   HANDLE BARCODE
   ========================================================== */

function handleBarcode(raw) {

  const sku =
    normalizeSku(raw);


  if (!sku) {
    return false;
  }


  /*
   * SKU kamu:
   *
   * 1042310302302-M
   */
  if (
    !/^\d+-[A-Z0-9]+$/.test(
      sku
    )
  ) {

    console.log(
      'Barcode terbaca tetapi bukan SKU:',
      sku
    );

    return false;

  }


  /*
   * Debounce barcode yang sama.
   */
  const now =
    Date.now();


  const previous =
    recentScans.get(
      sku
    ) || 0;


  if (
    now - previous <
    SAME_BARCODE_COOLDOWN
  ) {

    return true;

  }


  recentScans.set(
    sku,
    now
  );


  /*
   * Tampilkan hasil SEGERA.
   */
  showResult(
    sku
  );


  /*
   * Simpan ke Apps Script.
   *
   * Kamera TIDAK berhenti.
   */
  saveScan(
    sku
  );


  return true;

}


/* ==========================================================
   SHOW RESULT
   ========================================================== */

function showResult(sku) {

  lastSku.textContent =
    sku;


  saveStatus.textContent =
    'Barcode terdeteksi...';


  saveStatus.className =
    'save-status';


  resultCard.classList.remove(
    'flash'
  );


  void resultCard.offsetWidth;


  resultCard.classList.add(
    'flash'
  );


  instruction.textContent =
    '✓ ' + sku;

}


/* ==========================================================
   SAVE VIA JSONP
   ========================================================== */

function saveScan(sku) {

  const operator =
    operatorInput.value.trim();


  saveStatus.textContent =
    'Menyimpan...';


  callApi(

    'scan',

    {

      sku:
        sku,

      operator:
        operator,

      keterangan:
        ''

    },

    function(response) {

      if (
        response &&
        response.success
      ) {

        totalScan +=
          1;


        totalQty +=
          1;


        uniqueSku.add(
          sku
        );


        updateStats();


        if (
          response.data
        ) {

          historyData.unshift({

            scanId:
              response.data.scanId,

            tanggal:
              response.data.tanggal,

            jam:
              response.data.jam,

            timestamp:
              response.data.timestamp,

            sku:
              response.data.sku,

            qty:
              response.data.qty,

            operator:
              response.data.operator,

            keterangan:
              response.data.keterangan

          });


          if (
            historyData.length >
            200
          ) {

            historyData =
              historyData.slice(
                0,
                200
              );

          }


          renderHistory();

        }


        saveStatus.textContent =
          '✓ Tersimpan ' +
          response.data.jam;


        saveStatus.className =
          'save-status success';


        instruction.textContent =
          '✓ Siap scan berikutnya';


      } else {

        saveStatus.textContent =
          'Gagal: ' +
          (
            response.message ||
            'Tidak dapat menyimpan'
          );


        saveStatus.className =
          'save-status error';

      }

    }

  );

}


/* ==========================================================
   JSONP API
   ========================================================== */

function callApi(
  action,
  params,
  callback
) {

  /*
   * Buat nama callback unik.
   */
  const callbackName =
    'jsonp_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      'script'
    );


  const query =
    new URLSearchParams();


  query.set(
    'action',
    action
  );


  query.set(
    'callback',
    callbackName
  );


  Object.keys(
    params || {}
  ).forEach(
    function(key) {

      query.set(
        key,
        params[key]
      );

    }
  );


  const timeout =
    setTimeout(
      function() {

        cleanup();


        callback({

          success:
            false,

          message:
            'Server timeout.'

        });

      },
      15000
    );


  function cleanup() {

    clearTimeout(
      timeout
    );


    script.remove();


    try {

      delete window[
        callbackName
      ];

    } catch (error) {}

  }


  window[
    callbackName
  ] =
    function(response) {

      cleanup();

      callback(
        response
      );

    };


  script.onerror =
    function() {

      cleanup();


      callback({

        success:
          false,

        message:
          'Tidak dapat terhubung ke Apps Script.'

      });

    };


  script.src =
    API_URL +
    '?' +
    query.toString();


  document
    .body
    .appendChild(
      script
    );

}


/* ==========================================================
   LOAD DATA
   ========================================================== */

function loadData() {

  loadSummary();

  loadHistory();

  loadSkuSummary();

}


/* ==========================================================
   SUMMARY
   ========================================================== */

function loadSummary() {

  callApi(

    'summary',

    {},

    function(response) {

      if (
        response &&
        response.success
      ) {

        totalScan =
          Number(
            response.totalScan
          ) || 0;


        totalQty =
          Number(
            response.totalQty
          ) || 0;


        updateStats();

      }

    }

  );

}


/* ==========================================================
   HISTORY
   ========================================================== */

function loadHistory() {

  callApi(

    'history',

    {},

    function(response) {

      if (
        response &&
        response.success
      ) {

        historyData =
          response.data || [];


        historyData.forEach(
          function(item) {

            if (
              item.sku
            ) {

              uniqueSku.add(
                item.sku
              );

            }

          }
        );


        updateStats();

        renderHistory();

      }

    }

  );

}


/* ==========================================================
   RENDER HISTORY
   ========================================================== */

function renderHistory() {

  const box =
    document.getElementById(
      'history'
    );


  if (
    !historyData.length
  ) {

    box.innerHTML =
      '<div class="empty">Belum ada scan.</div>';

    return;

  }


  let html = '';


  historyData.forEach(
    function(item) {

      html += `

        <div class="row">

          <div class="row-top">

            <div class="row-sku">
              ${escapeHtml(item.sku)}
            </div>

            <div class="row-qty">
              ×${Number(item.qty || 0)}
            </div>

          </div>

          <div class="row-info">
            ${escapeHtml(item.tanggal)}
            &nbsp;
            ${escapeHtml(item.jam)}
            ${
              item.operator
                ? ' · ' +
                  escapeHtml(item.operator)
                : ''
            }
          </div>

          <button
            class="delete"
            onclick="deleteScan('${escapeJs(item.scanId)}')"
          >
            Hapus
          </button>

        </div>

      `;

    }
  );


  box.innerHTML =
    html;

}


/* ==========================================================
   SKU SUMMARY
   ========================================================== */

function loadSkuSummary() {

  callApi(

    'skuSummary',

    {},

    function(response) {

      if (
        response &&
        response.success
      ) {

        renderSkuSummary(
          response.data || []
        );

      }

    }

  );

}


/* ==========================================================
   RENDER SKU SUMMARY
   ========================================================== */

function renderSkuSummary(
  data
) {

  const box =
    document.getElementById(
      'skuSummary'
    );


  if (
    !data.length
  ) {

    box.innerHTML =
      '<div class="empty">Belum ada data.</div>';

    return;

  }


  let html = '';


  data.forEach(
    function(item, index) {

      html += `

        <div class="row">

          <div class="row-top">

            <div class="row-sku">

              ${index + 1}.
              ${escapeHtml(item.sku)}

            </div>

            <div class="row-qty">

              ${Number(item.qty || 0)}

            </div>

          </div>

        </div>

      `;

    }
  );


  box.innerHTML =
    html;

}


/* ==========================================================
   DELETE
   ========================================================== */

function deleteScan(id) {

  if (
    !confirm(
      'Hapus data scan ini?'
    )
  ) {

    return;

  }


  callApi(

    'delete',

    {
      id:
        id
    },

    function(response) {

      if (
        response &&
        response.success
      ) {

        loadData();

      } else {

        alert(
          response.message ||
          'Gagal menghapus.'
        );

      }

    }

  );

}


/* ==========================================================
   MANUAL
   ========================================================== */

function manualEnter(
  event
) {

  if (
    event.key ===
    'Enter'
  ) {

    manualScan();

  }

}


function manualScan() {

  const input =
    document.getElementById(
      'manualSku'
    );


  const sku =
    normalizeSku(
      input.value
    );


  if (!sku) {

    return;

  }


  if (
    !/^\d+-[A-Z0-9]+$/.test(
      sku
    )
  ) {

    showStatus(
      'Format SKU tidak sesuai.',
      true
    );

    return;

  }


  /*
   * Manual langsung masuk proses yang sama.
   */
  recentScans.set(
    sku,
    Date.now()
  );


  showResult(
    sku
  );


  saveScan(
    sku
  );


  input.value =
    '';

}


/* ==========================================================
   NORMALIZE
   ========================================================== */

function normalizeSku(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /[\r\n\t]/g,
      ''
    )
    .replace(
      /\s+/g,
      ''
    )
    .trim()
    .toUpperCase();

}


/* ==========================================================
   STATS
   ========================================================== */

function updateStats() {

  document.getElementById(
    'totalScan'
  ).textContent =
    totalScan.toLocaleString(
      'id-ID'
    );


  document.getElementById(
    'totalQty'
  ).textContent =
    totalQty.toLocaleString(
      'id-ID'
    );


  document.getElementById(
    'uniqueSku'
  ).textContent =
    uniqueSku.size.toLocaleString(
      'id-ID'
    );

}


/* ==========================================================
   STATUS
   ========================================================== */

function showStatus(
  message,
  isError
) {

  instruction.textContent =
    message;


  if (isError) {

    saveStatus.textContent =
      message;

    saveStatus.className =
      'save-status error';

  }

}


/* ==========================================================
   ESCAPE
   ========================================================== */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeJs(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /\\/g,
      '\\\\'
    )
    .replace(
      /'/g,
      "\\'"
    );

}


/* ==========================================================
   PAGE VISIBILITY
   ========================================================== */

document.addEventListener(
  'visibilitychange',
  function() {

    if (
      document.hidden &&
      scannerRunning
    ) {

      stopScanner();

    }

  }
);


/* ==========================================================
   BEFORE CLOSE
   ========================================================== */

window.addEventListener(
  'beforeunload',
  function() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }

  }
);

</script>
