<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">

  <title>Live Barcode Scanner</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    .header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(0,0,0,.95);
      border-bottom: 1px solid #222;
      position: relative;
      z-index: 20;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
    }

    .subtitle {
      color: #777;
      font-size: 11px;
      margin-top: 2px;
    }

    .camera-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: #888;
    }

    .camera-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #555;
    }

    .camera-dot.on {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34,197,94,.8);
    }

    .camera {
      position: relative;
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      min-height: 430px;
      max-height: 76vh;
      object-fit: cover;
      background: #000;
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .scan-area {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 28%;
      height: 44%;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 22px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.22);
    }

    .corner {
      position: absolute;
      width: 42px;
      height: 42px;
      border: 4px solid #fff;
    }

    .tl {
      left: -2px;
      top: -2px;
      border-right: 0;
      border-bottom: 0;
      border-radius: 20px 0 0 0;
    }

    .tr {
      right: -2px;
      top: -2px;
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 20px 0 0;
    }

    .bl {
      left: -2px;
      bottom: -2px;
      border-right: 0;
      border-top: 0;
      border-radius: 0 0 0 20px;
    }

    .br {
      right: -2px;
      bottom: -2px;
      border-left: 0;
      border-top: 0;
      border-radius: 0 0 20px 0;
    }

    .laser {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 50%;
      height: 2px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 0 12px rgba(255,255,255,.9);
      animation: laser 1.7s linear infinite;
    }

    @keyframes laser {
      0% {
        transform: translateY(-110px);
        opacity: .25;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform: translateY(110px);
        opacity: .25;
      }
    }

    .instruction {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      padding: 9px 15px;
      border-radius: 999px;
      background: rgba(0,0,0,.7);
      border: 1px solid rgba(255,255,255,.18);
      white-space: nowrap;
      font-size: 12px;
      color: #ddd;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result {
      padding: 16px;
      background: #080808;
    }

    .result-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 18px;
    }

    .result-label {
      color: #666;
      font-size: 10px;
      margin-bottom: 8px;
      letter-spacing: .5px;
    }

    .sku {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .5px;
      word-break: break-all;
    }

    .save-status {
      margin-top: 8px;
      color: #777;
      font-size: 12px;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }

    .content {
      padding: 0 16px 40px;
      background: #080808;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .start {
      background: #fff;
      color: #000;
    }

    .stop {
      background: #dc2626;
      color: #fff;
    }

    .operator-box {
      margin-top: 14px;
    }

    .label {
      display: block;
      font-size: 11px;
      color: #666;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #292929;
      background: #111;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #777;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .stat {
      padding: 13px;
      border-radius: 13px;
      background: #111;
      border: 1px solid #222;
    }

    .stat-label {
      font-size: 9px;
      color: #666;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 19px;
      font-weight: 800;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .manual-row {
      display: flex;
      gap: 8px;
    }

    .manual-row input {
      flex: 1;
      min-width: 0;
    }

    .manual-button {
      width: 90px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #000;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .list {
      background: #111;
      border: 1px solid #222;
      border-radius: 15px;
      overflow: hidden;
    }

    .row {
      padding: 13px;
      border-bottom: 1px solid #222;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .row-sku {
      font-size: 13px;
      font-weight: 700;
      word-break: break-all;
    }

    .row-qty {
      font-weight: 800;
      white-space: nowrap;
    }

    .row-info {
      margin-top: 5px;
      font-size: 10px;
      color: #666;
    }

    .delete {
      margin-top: 8px;
      padding: 6px 9px;
      border: 0;
      border-radius: 8px;
      background: #2a1010;
      color: #f87171;
      font-size: 10px;
      cursor: pointer;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: #555;
      font-size: 12px;
    }

    .flash {
      animation: flash .35s ease-out;
    }

    @keyframes flash {
      0% {
        box-shadow: inset 0 0 0 5px rgba(34,197,94,0);
      }

      50% {
        box-shadow: inset 0 0 0 5px rgba(34,197,94,.9);
      }

      100% {
        box-shadow: inset 0 0 0 5px rgba(34,197,94,0);
      }
    }

    canvas {
      display: none;
    }

    @media (max-width: 500px) {
      video {
        min-height: 400px;
      }

      .stats {
        gap: 6px;
      }

      .stat {
        padding: 10px;
      }

      .stat-value {
        font-size: 17px;
      }
    }
  </style>

</head>

<script>

'use strict';

/* ==========================================================
   KONFIGURASI
   ========================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw8Ip7i3pQPLh173A6Ca423wyCObCUkdT8AEafC0uZJSf4B_oDz5KTMVDOY_aohEeVGNg/exec';


/* ==========================================================
   GLOBAL
   ========================================================== */

let stream = null;
let scannerRunning = false;
let scanTimer = null;
let barcodeDetector = null;
let zxingReader = null;
let detecting = false;

const recentScans = new Map();
const SAME_BARCODE_COOLDOWN = 1200;

let totalScan = 0;
let totalQty = 0;
const uniqueSku = new Set();
let historyData = [];


/* ==========================================================
   ELEMENT
   ========================================================== */

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', {
  willReadFrequently: true
});

const startButton = document.getElementById('startButton');
const manualButton = document.getElementById('manualButton');
const manualSkuInput = document.getElementById('manualSku');

const cameraDot = document.getElementById('cameraDot');
const cameraText = document.getElementById('cameraText');
const instruction = document.getElementById('instruction');

const lastSku = document.getElementById('lastSku');
const saveStatus = document.getElementById('saveStatus');
const resultCard = document.getElementById('resultCard');

const operatorInput = document.getElementById('operator');


/* ==========================================================
   OPERATOR
   ========================================================== */

try {
  operatorInput.value =
    localStorage.getItem('scanner_operator') || '';
} catch (e) {
  operatorInput.value = '';
}

operatorInput.addEventListener('input', function () {
  try {
    localStorage.setItem(
      'scanner_operator',
      this.value
    );
  } catch (e) {}
});


/* ==========================================================
   BUTTON EVENT
   ========================================================== */

startButton.addEventListener('click', function () {
  toggleScanner();
});

manualButton.addEventListener('click', function () {
  manualScan();
});

manualSkuInput.addEventListener('keydown', function (event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    manualScan();
  }
});


/* ==========================================================
   STARTUP
   ========================================================== */

window.addEventListener('load', function () {

  prepareDecoder();

  loadData();

});


/* ==========================================================
   PREPARE DECODER
   ========================================================== */

async function prepareDecoder() {

  if ('BarcodeDetector' in window) {

    try {

      let formats = [];

      if (
        typeof BarcodeDetector.getSupportedFormats ===
        'function'
      ) {
        formats =
          await BarcodeDetector.getSupportedFormats();
      }

      const wanted = [
        'code_128',
        'code_39',
        'code_93',
        'codabar',
        'ean_13',
        'ean_8',
        'itf',
        'upc_a',
        'upc_e',
        'qr_code'
      ];

      const usable = wanted.filter(function (format) {
        return (
          formats.length === 0 ||
          formats.includes(format)
        );
      });

      if (usable.length > 0) {
        barcodeDetector =
          new BarcodeDetector({
            formats: usable
          });
      } else {
        barcodeDetector =
          new BarcodeDetector();
      }

      console.log(
        'Native BarcodeDetector aktif'
      );

    } catch (error) {

      console.log(
        'BarcodeDetector gagal:',
        error
      );

      barcodeDetector = null;
    }
  }

  setupZXing();
}


/* ==========================================================
   ZXING
   ========================================================== */

function setupZXing() {

  if (typeof ZXing === 'undefined') {

    console.log(
      'ZXing belum tersedia.'
    );

    return;
  }

  try {

    zxingReader =
      new ZXing.MultiFormatReader();

    const hints = new Map();

    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.CODE_93,
        ZXing.BarcodeFormat.CODABAR,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.ITF,
        ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.QR_CODE
      ]
    );

    hints.set(
      ZXing.DecodeHintType.TRY_HARDER,
      true
    );

    zxingReader.setHints(hints);

    console.log(
      'ZXing aktif'
    );

  } catch (error) {

    console.log(
      'ZXing setup error:',
      error
    );

    zxingReader = null;
  }
}


/* ==========================================================
   TOGGLE
   ========================================================== */

async function toggleScanner() {

  if (scannerRunning) {
    stopScanner();
  } else {
    await startScanner();
  }

}


/* ==========================================================
   START CAMERA
   ========================================================== */

async function startScanner() {

  if (!API_URL) {

    showStatus(
      'URL Apps Script belum tersedia.',
      true
    );

    return;
  }

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(
      'Browser tidak mendukung kamera.',
      true
    );

    return;
  }

  try {

    instruction.textContent =
      'Meminta izin kamera...';

    saveStatus.textContent =
      'Membuka kamera...';

    saveStatus.className =
      'save-status';

    stream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {
          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          },

          frameRate: {
            ideal: 30,
            max: 30
          }
        }

      });

    video.srcObject = stream;

    await video.play();

    try {

      const track =
        stream.getVideoTracks()[0];

      if (
        track &&
        typeof track.getCapabilities === 'function'
      ) {

        const capabilities =
          track.getCapabilities();

        if (
          capabilities.focusMode &&
          capabilities.focusMode.includes('continuous')
        ) {

          await track.applyConstraints({
            advanced: [
              {
                focusMode: 'continuous'
              }
            ]
          });

        }
      }

    } catch (focusError) {

      console.log(
        'Autofocus tidak tersedia:',
        focusError
      );
    }

    scannerRunning = true;

    cameraDot.classList.add('on');

    cameraText.textContent =
      'Kamera ON';

    startButton.textContent =
      '■ STOP SCANNER';

    startButton.classList.remove('start');
    startButton.classList.add('stop');

    instruction.textContent =
      'Arahkan barcode ke kotak';

    saveStatus.textContent =
      'Kamera siap digunakan';

    saveStatus.className =
      'save-status success';

    startDetectionLoop();

  } catch (error) {

    console.error(
      'Camera error:',
      error
    );

    scannerRunning = false;

    if (stream) {

      stream.getTracks().forEach(function (track) {
        track.stop();
      });

      stream = null;
    }

    let message =
      'Kamera gagal dibuka.';

    if (error.name === 'NotAllowedError') {

      message =
        'Izin kamera ditolak. Izinkan Camera untuk website ini.';

    } else if (error.name === 'NotFoundError') {

      message =
        'Kamera tidak ditemukan pada perangkat.';

    } else if (error.name === 'NotReadableError') {

      message =
        'Kamera sedang digunakan aplikasi lain.';

    } else if (error.name === 'SecurityError') {

      message =
        'Browser memblokir akses kamera. Pastikan menggunakan HTTPS.';

    } else if (error.message) {

      message =
        error.message;
    }

    showStatus(
      message,
      true
    );
  }
}


/* ==========================================================
   STOP CAMERA
   ========================================================== */

function stopScanner() {

  scannerRunning = false;
  detecting = false;

  if (scanTimer) {
    clearTimeout(scanTimer);
    scanTimer = null;
  }

  if (stream) {

    stream.getTracks().forEach(function (track) {
      track.stop();
    });

    stream = null;
  }

  video.srcObject = null;

  cameraDot.classList.remove('on');

  cameraText.textContent =
    'Kamera OFF';

  startButton.textContent =
    '📷 MULAI SCANNER';

  startButton.classList.remove('stop');
  startButton.classList.add('start');

  instruction.textContent =
    'Tekan MULAI SCANNER';

}


/* ==========================================================
   DETECTION LOOP
   ========================================================== */

function startDetectionLoop() {

  if (!scannerRunning) {
    return;
  }

  detectFrame();

  scanTimer =
    setTimeout(
      startDetectionLoop,
      120
    );
}


/* ==========================================================
   DETECT FRAME
   ========================================================== */

async function detectFrame() {

  if (!scannerRunning) {
    return;
  }

  if (detecting) {
    return;
  }

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {
    return;
  }

  detecting = true;

  try {

    const width = 1280;

    const ratio =
      video.videoHeight /
      video.videoWidth;

    const height =
      Math.round(width * ratio);

    canvas.width = width;
    canvas.height = height;

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    let found = false;

    if (barcodeDetector) {

      try {

        const results =
          await barcodeDetector.detect(canvas);

        if (
          results &&
          results.length > 0
        ) {

          for (
            let i = 0;
            i < results.length;
            i++
          ) {

            const result = results[i];

            if (result.rawValue) {

              const accepted =
                handleBarcode(
                  result.rawValue
                );

              if (accepted) {

                found = true;
                break;

              }
            }
          }
        }

      } catch (error) {

        console.log(
          'Native detector:',
          error
        );
      }
    }

    if (
      !found &&
      zxingReader
    ) {

      try {

        const result =
          zxingReader.decode(canvas);

        if (result) {

          handleBarcode(
            result.getText()
          );
        }

      } catch (error) {

        /* Tidak menemukan barcode adalah normal. */
      }
    }

  } catch (error) {

    console.log(
      'Frame error:',
      error
    );

  } finally {

    detecting = false;
  }
}


/* ==========================================================
   BARCODE
   ========================================================== */

function handleBarcode(raw) {

  const sku =
    normalizeSku(raw);

  if (!sku) {
    return false;
  }

  /*
   * SKU:
   * 1042310302302-M
   *
   * Tetapi scanner juga menerima
   * barcode alfanumerik umum.
   */

  if (
    !/^[A-Z0-9][A-Z0-9._/-]*$/i.test(sku)
  ) {

    console.log(
      'Barcode tidak valid:',
      sku
    );

    return false;
  }

  const now =
    Date.now();

  const previous =
    recentScans.get(sku) || 0;

  if (
    now - previous <
    SAME_BARCODE_COOLDOWN
  ) {

    return true;
  }

  recentScans.set(
    sku,
    now
  );

  showResult(sku);

  saveScan(sku);

  return true;
}


/* ==========================================================
   RESULT
   ========================================================== */

function showResult(sku) {

  lastSku.textContent = sku;

  saveStatus.textContent =
    'Barcode terdeteksi...';

  saveStatus.className =
    'save-status';

  resultCard.classList.remove('flash');

  void resultCard.offsetWidth;

  resultCard.classList.add('flash');

  instruction.textContent =
    '✓ ' + sku;
}


/* ==========================================================
   SAVE
   ========================================================== */

function saveScan(sku) {

  const operator =
    operatorInput.value.trim();

  saveStatus.textContent =
    'Menyimpan...';

  saveStatus.className =
    'save-status';

  callApi(
    'scan',
    {
      sku: sku,
      operator: operator,
      keterangan: ''
    },
    function (response) {

      if (
        response &&
        response.success
      ) {

        totalScan += 1;
        totalQty += 1;

        uniqueSku.add(sku);

        updateStats();

        if (response.data) {

          historyData.unshift({
            scanId:
              response.data.scanId || '',

            tanggal:
              response.data.tanggal || '',

            jam:
              response.data.jam || '',

            timestamp:
              response.data.timestamp || '',

            sku:
              response.data.sku || sku,

            qty:
              response.data.qty || 1,

            operator:
              response.data.operator || operator,

            keterangan:
              response.data.keterangan || ''
          });

          if (
            historyData.length > 200
          ) {

            historyData =
              historyData.slice(0, 200);
          }

          renderHistory();
        }

        const jam =
          response.data &&
          response.data.jam
            ? response.data.jam
            : '';

        saveStatus.textContent =
          '✓ Tersimpan ' + jam;

        saveStatus.className =
          'save-status success';

        instruction.textContent =
          '✓ Siap scan berikutnya';

        loadSkuSummary();

      } else {

        saveStatus.textContent =
          'Gagal: ' +
          (
            response &&
            response.message
              ? response.message
              : 'Tidak dapat menyimpan'
          );

        saveStatus.className =
          'save-status error';
      }
    }
  );
}


/* ==========================================================
   JSONP API
   ========================================================== */

function callApi(
  action,
  params,
  callback
) {

  if (!API_URL) {

    callback({
      success: false,
      message: 'URL Apps Script kosong.'
    });

    return;
  }

  const callbackName =
    'jsonp_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );

  const script =
    document.createElement('script');

  const query =
    new URLSearchParams();

  query.set(
    'action',
    action
  );

  query.set(
    'callback',
    callbackName
  );

  Object.keys(
    params || {}
  ).forEach(function (key) {

    query.set(
      key,
      params[key] == null
        ? ''
        : String(params[key])
    );

  });

  let finished = false;

  const timeout =
    setTimeout(function () {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();

      callback({
        success: false,
        message: 'Server timeout.'
      });

    }, 15000);


  function cleanup() {

    clearTimeout(timeout);

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch (e) {}
  }


  window[callbackName] =
    function (response) {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();

      callback(
        response
      );
    };


  script.onerror =
    function () {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();

      callback({
        success: false,
        message:
          'Tidak dapat terhubung ke Apps Script.'
      });
    };


  script.src =
    API_URL +
    '?' +
    query.toString();

  document.body.appendChild(
    script
  );
}


/* ==========================================================
   LOAD DATA
   ========================================================== */

function loadData() {

  loadSummary();
  loadHistory();
  loadSkuSummary();

}


/* ==========================================================
   SUMMARY
   ========================================================== */

function loadSummary() {

  callApi(
    'summary',
    {},
    function (response) {

      if (
        response &&
        response.success
      ) {

        totalScan =
          Number(
            response.totalScan
          ) || 0;

        totalQty =
          Number(
            response.totalQty
          ) || 0;

        updateStats();
      }
    }
  );
}


/* ==========================================================
   HISTORY
   ========================================================== */

function loadHistory() {

  callApi(
    'history',
    {},
    function (response) {

      if (
        response &&
        response.success
      ) {

        historyData =
          Array.isArray(response.data)
            ? response.data
            : [];

        historyData.forEach(function (item) {

          if (item && item.sku) {
            uniqueSku.add(
              item.sku
            );
          }

        });

        updateStats();
        renderHistory();
      }
    }
  );
}


/* ==========================================================
   RENDER HISTORY
   ========================================================== */

function renderHistory() {

  const box =
    document.getElementById(
      'history'
    );

  if (
    !historyData.length
  ) {

    box.innerHTML =
      '<div class="empty">Belum ada scan.</div>';

    return;
  }

  let html = '';

  historyData.forEach(function (item) {

    const sku =
      escapeHtml(
        item.sku || ''
      );

    const qty =
      Number(
        item.qty || 0
      );

    const tanggal =
      escapeHtml(
        item.tanggal || ''
      );

    const jam =
      escapeHtml(
        item.jam || ''
      );

    const operator =
      escapeHtml(
        item.operator || ''
      );

    const scanId =
      escapeJs(
        item.scanId || ''
      );

    html +=
      '<div class="row">' +

        '<div class="row-top">' +

          '<div class="row-sku">' +
            sku +
          '</div>' +

          '<div class="row-qty">' +
            '×' + qty +
          '</div>' +

        '</div>' +

        '<div class="row-info">' +
          tanggal +
          ' ' +
          jam +
          (
            operator
              ? ' · ' + operator
              : ''
          ) +
        '</div>' +

        '<button ' +
          'class="delete" ' +
          'type="button" ' +
          'data-scan-id="' +
            scanId +
          '">' +
          'Hapus' +
        '</button>' +

      '</div>';
  });

  box.innerHTML = html;

  const buttons =
    box.querySelectorAll(
      '.delete'
    );

  buttons.forEach(function (button) {

    button.addEventListener(
      'click',
      function () {

        deleteScan(
          this.getAttribute(
            'data-scan-id'
          )
        );

      }
    );

  });
}


/* ==========================================================
   SKU SUMMARY
   ========================================================== */

function loadSkuSummary() {

  callApi(
    'skuSummary',
    {},
    function (response) {

      if (
        response &&
        response.success
      ) {

        renderSkuSummary(
          Array.isArray(response.data)
            ? response.data
            : []
        );
      }
    }
  );
}


/* ==========================================================
   RENDER SKU SUMMARY
   ========================================================== */

function renderSkuSummary(data) {

  const box =
    document.getElementById(
      'skuSummary'
    );

  if (!data.length) {

    box.innerHTML =
      '<div class="empty">Belum ada data.</div>';

    return;
  }

  let html = '';

  data.forEach(function (item, index) {

    html +=
      '<div class="row">' +

        '<div class="row-top">' +

          '<div class="row-sku">' +
            (index + 1) +
            '. ' +
            escapeHtml(
              item.sku || ''
            ) +
          '</div>' +

          '<div class="row-qty">' +
            Number(item.qty || 0) +
          '</div>' +

        '</div>' +

      '</div>';
  });

  box.innerHTML = html;
}
